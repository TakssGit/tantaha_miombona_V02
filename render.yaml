services:
  - type: web
    name: tantsaha-miombona-preview
    runtime: node
    plan: free
    buildCommand: >-
      npm install --prefix client &&
      npm install --prefix server &&
      npm run db:migrate --prefix server &&
      npm run build:client &&
      npm run build:server
    startCommand: cd server && node dist/src/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: VITE_API_URL
        value: /api
      - key: DATABASE_PATH
        value: ./data/tantsaha_miombona.db
      - key: JWT_SECRET
        generateValue: true
