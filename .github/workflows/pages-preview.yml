name: Tantsaha V02 - Deploy React

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --prefix client --include=dev

      - name: Build React
        run: npm run build --prefix client -- --base=/tantaha_miombona_V02/

      - name: Prepare GitHub Pages
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          const dist = 'client/dist';
          const prefix = '/tantaha_miombona_V02/';

          function walk(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const file = path.join(dir, entry.name);
              if (entry.isDirectory()) {
                walk(file);
              } else if (/\.(html|js|css)$/.test(entry.name)) {
                let content = fs.readFileSync(file, 'utf8');
                content = content.replace(
                  /(["'(])\/assets\//g,
                  '$1' + prefix + 'assets/'
                );
                fs.writeFileSync(file, content);
              }
            }
          }

          walk(dist);

          fs.copyFileSync(
            path.join(dist, 'index.html'),
            path.join(dist, '404.html')
          );
          NODE

          test -f client/dist/index.html
          test -d client/dist/assets

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload React build
        uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4