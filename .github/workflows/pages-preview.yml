name: Publier Tantsaha Miombona V02 sur GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-tantsaha-v02
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Recuperer les sources
        uses: actions/checkout@v4
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Installer les dependances client
        run: npm ci --prefix client --include=dev
      - name: Compiler le frontend pour Pages
        run: npm run build --prefix client -- --base=/tantaha_miombona_V02/
      - name: Verifier les fichiers du site
        shell: bash
        run: |
          set -euo pipefail
          test -s client/dist/index.html
          test -d client/dist/assets
          grep -q '/tantaha_miombona_V02/assets/' client/dist/index.html
          cp client/dist/index.html client/dist/404.html
      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5
      - name: Envoyer le site statique
        uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist
      - name: Publier le site
        id: deploy
        uses: actions/deploy-pages@v4
